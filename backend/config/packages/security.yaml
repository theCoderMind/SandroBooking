security:
    password_hashers:
        App\Module\User\Domain\Entity\User:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Module\User\Domain\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # Widget API — Public (nur per Public-Key authentifiziert, kein JWT)
        widget_api:
            pattern: ^/api/v1/widget
            stateless: true
            custom_authenticators:
                - App\Api\Security\PublicKeyAuthenticator

        # Admin API — JWT geschützt
        admin_api:
            pattern: ^/api
            stateless: true
            jwt: ~

        main:
            lazy: true

    access_control:
        - { path: ^/api/v1/widget, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/auth/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/admin, roles: ROLE_TENANT_ADMIN }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
