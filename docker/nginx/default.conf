server {
    listen 80;
    server_name localhost;
    root /var/www/backend/public;
    index index.php;

    # Logs
    access_log /var/log/nginx/lysandro_access.log;
    error_log  /var/log/nginx/lysandro_error.log;

    # Symfony Front-Controller
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    # Alle anderen .php blockieren
    location ~ \.php$ {
        return 404;
    }

    # CORS-Header für die Angular-Apps (Dev)
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PATCH, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Public-Key' always;

    gzip on;
    gzip_types application/json application/javascript text/css;
}
