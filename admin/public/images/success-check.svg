<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Lyandro Booking — Success Check
       Original artwork. -->

  <!-- Glow -->
  <circle cx="60" cy="60" r="58" fill="#22c55e" fill-opacity="0.10"/>
  <circle cx="60" cy="60" r="46" fill="#22c55e" fill-opacity="0.18"/>

  <!-- Hauptkreis -->
  <circle cx="60" cy="60" r="36" fill="#22c55e"/>

  <!-- Akzent-Ring (Brand-Gold) -->
  <circle cx="60" cy="60" r="36" fill="none"
          stroke="#ffb700" stroke-width="2" stroke-opacity="0.7"
          stroke-dasharray="2 4"/>

  <!-- Häkchen -->
  <path d="M 44 60 L 56 72 L 78 50" fill="none"
        stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Sparkles -->
  <g fill="#ffb700">
    <circle cx="20" cy="30" r="2"/>
    <circle cx="100" cy="28" r="2"/>
    <circle cx="105" cy="90" r="1.6"/>
    <circle cx="14" cy="86" r="1.6"/>
  </g>
</svg>
