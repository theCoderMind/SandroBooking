<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 70" class="table-svg table-svg--wide">
  <!-- Lounge-Sofa / Sitzbank (lange Form) -->
  <!-- Rückenlehne -->
  <rect x="6" y="10" width="128" height="14" rx="6"
        fill="#1a1f2e" stroke="#2979ff" stroke-width="2"/>
  <!-- Sitzfläche -->
  <rect x="6" y="24" width="128" height="30" rx="6"
        fill="#1a1f2e" stroke="#2979ff" stroke-width="2"/>
  <!-- Polsterungs-Trennlinien -->
  <line x1="50" y1="26" x2="50" y2="52" stroke="#2979ff" stroke-opacity="0.5" stroke-width="1.4"/>
  <line x1="90" y1="26" x2="90" y2="52" stroke="#2979ff" stroke-opacity="0.5" stroke-width="1.4"/>
  <!-- Kissen (Gold-Akzent) -->
  <rect x="16" y="30" width="20" height="14" rx="3" fill="#ffb700" opacity="0.55"/>
  <rect x="104" y="30" width="20" height="14" rx="3" fill="#ffb700" opacity="0.55"/>
  <!-- Füße -->
  <rect x="10" y="54" width="6" height="8" fill="#2979ff" opacity="0.8"/>
  <rect x="124" y="54" width="6" height="8" fill="#2979ff" opacity="0.8"/>
</svg>
