<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 70" class="table-svg">
  <!-- Tür mit Schwung-Andeutung -->
  <!-- Türrahmen-Anker -->
  <rect x="6" y="32" width="6" height="6" fill="#2979ff" opacity="0.8"/>
  <rect x="58" y="32" width="6" height="6" fill="#2979ff" opacity="0.8"/>
  <!-- Türblatt (offen) -->
  <rect x="12" y="14" width="6" height="22" rx="1"
