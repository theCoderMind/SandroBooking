<div class="settings-block">
  <div class="page-hero">
    <div class="page-hero__icon"><mat-icon>groups</mat-icon></div>
    <div>
      <h2 class="page-hero__title">Kunden / CRM</h2>
      <p class="page-hero__sub">
        Deine Gäste in einer zentralen Übersicht — mit Historie, Tags, Vorlieben
        und Kennzahlen. So erkennst du Stammgäste beim Einchecken und kannst
        gezielt kommunizieren.
      </p>
    </div>
    <span class="soon-pill">In Vorbereitung</span>
  </div>

  <div class="feature-list">
    @for (f of features; track f.label) {
      <div class="feature">
        <div class="feature__icon"><mat-icon>{{ f.icon }}</mat-icon></div>
        <span>{{ f.label }}</span>
      </div>
    }
  </div>
</div>
