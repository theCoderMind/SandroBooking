<div class="settings-block">
  <div class="page-hero">
    <div class="page-hero__icon"><mat-icon>schedule</mat-icon></div>
    <div>
      <h2 class="page-hero__title">Öffnungszeiten</h2>
      <p class="page-hero__sub">
        Legt fest, wann Gäste online buchen können und wann das Restaurant regulär
        geöffnet ist — inklusive Service-Zeiten, Ruhetagen und Sonderöffnungen.
      </p>
    </div>
    <span class="soon-pill">In Vorbereitung</span>
  </div>

  <div class="feature-list">
    @for (f of features; track f.label) {
      <div class="feature">
        <div class="feature__icon"><mat-icon>{{ f.icon }}</mat-icon></div>
        <span>{{ f.label }}</span>
      </div>
    }
  </div>
</div>
