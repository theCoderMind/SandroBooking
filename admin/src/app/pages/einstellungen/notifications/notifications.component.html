<div class="settings-block">
  <div class="page-hero">
    <div class="page-hero__icon"><mat-icon>notifications_active</mat-icon></div>
    <div>
      <h2 class="page-hero__title">{{ 'notifications.title' | translate }}</h2>
      <p class="page-hero__sub">{{ 'notifications.subtitle' | translate }}</p>
    </div>
    <span class="soon-pill">{{ 'common.in_progress' | translate }}</span>
  </div>

  <div class="feature-list">
    @for (f of features; track f.label) {
      <div class="feature">
        <div class="feature__icon"><mat-icon>{{ f.icon }}</mat-icon></div>
        <span>{{ f.label }}</span>
      </div>
    }
  </div>
</div>
