<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <\!-- Kalender-Blau, Verlauf von hellem Sky-Blue oben zu kräftigem Royal-Blue unten -->
    <linearGradient id="calBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#6FA3F0"/>
      <stop offset="100%" stop-color="#1E5FCC"/>
    </linearGradient>
    <linearGradient id="calBlueDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#3A6FCC"/>
      <stop offset="100%" stop-color="#194FAA"/>
    </linearGradient>

    <\!-- Pin: warmes Gelb mit subtilem Verlauf -->
    <linearGradient id="pinYellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#FFE066"/>
      <stop offset="60%" stop-color="#FFCD2E"/>
      <stop offset="100%" stop-color="#F5B400"/>
    </linearGradient>

    <\!-- Pin-Innenkreis: dunkles Marineblau (matcht Logo-Hintergrund-Vibe) -->
    <radialGradient id="pinInner" cx="50%" cy="40%" r="60%">
      <stop offset="0%"  stop-color="#1A2840"/>
      <stop offset="100%" stop-color="#0A1525"/>
    </radialGradient>

    <\!-- Sanftes Highlight auf dem Pin oben -->
    <radialGradient id="pinHighlight" cx="35%" cy="25%" r="40%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <\!-- ======================== Punkt-Ring ======================== -->
  <g id="ring">
    <circle cx="400.0" cy="60.0" r="11" fill="#FFC107"/>
    <circle cx="435.5" cy="61.9" r="4" fill="#5B8FE8"/>
    <circle cx="470.7" cy="67.4" r="5" fill="#5B8FE8"/>
    <circle cx="505.1" cy="76.6" r="4" fill="#5B8FE8"/>
    <circle cx="538.3" cy="89.4" r="5" fill="#5B8FE8"/>
    <circle cx="570.0" cy="105.6" r="4" fill="#5B8FE8"/>
    <circle cx="599.8" cy="124.9" r="11" fill="#FFC107"/>
    <circle cx="627.5" cy="147.3" r="4" fill="#5B8FE8"/>
    <circle cx="652.7" cy="172.5" r="5" fill="#5B8FE8"/>
    <circle cx="675.1" cy="200.2" r="4" fill="#5B8FE8"/>
    <circle cx="694.4" cy="230.0" r="5" fill="#5B8FE8"/>
    <circle cx="710.6" cy="261.7" r="4" fill="#5B8FE8"/>
    <circle cx="723.4" cy="294.9" r="11" fill="#FFC107"/>
    <circle cx="732.6" cy="329.3" r="4" fill="#5B8FE8"/>
    <circle cx="738.1" cy="364.5" r="5" fill="#5B8FE8"/>
    <circle cx="740.0" cy="400.0" r="4" fill="#5B8FE8"/>
    <circle cx="738.1" cy="435.5" r="5" fill="#5B8FE8"/>
    <circle cx="732.6" cy="470.7" r="4" fill="#5B8FE8"/>
    <circle cx="723.4" cy="505.1" r="11" fill="#FFC107"/>
    <circle cx="710.6" cy="538.3" r="4" fill="#5B8FE8"/>
    <circle cx="694.4" cy="570.0" r="5" fill="#5B8FE8"/>
    <circle cx="675.1" cy="599.8" r="4" fill="#5B8FE8"/>
    <circle cx="652.7" cy="627.5" r="5" fill="#5B8FE8"/>
    <circle cx="627.5" cy="652.7" r="4" fill="#5B8FE8"/>
    <circle cx="599.8" cy="675.1" r="11" fill="#FFC107"/>
    <circle cx="570.0" cy="694.4" r="4" fill="#5B8FE8"/>
    <circle cx="538.3" cy="710.6" r="5" fill="#5B8FE8"/>
    <circle cx="505.1" cy="723.4" r="4" fill="#5B8FE8"/>
    <circle cx="470.7" cy="732.6" r="5" fill="#5B8FE8"/>
    <circle cx="435.5" cy="738.1" r="4" fill="#5B8FE8"/>
    <circle cx="400.0" cy="740.0" r="11" fill="#FFC107"/>
    <circle cx="364.5" cy="738.1" r="4" fill="#5B8FE8"/>
    <circle cx="329.3" cy="732.6" r="5" fill="#5B8FE8"/>
    <circle cx="294.9" cy="723.4" r="4" fill="#5B8FE8"/>
    <circle cx="261.7" cy="710.6" r="5" fill="#5B8FE8"/>
    <circle cx="230.0" cy="694.4" r="4" fill="#5B8FE8"/>
    <circle cx="200.2" cy="675.1" r="11" fill="#FFC107"/>
    <circle cx="172.5" cy="652.7" r="4" fill="#5B8FE8"/>
    <circle cx="147.3" cy="627.5" r="5" fill="#5B8FE8"/>
    <circle cx="124.9" cy="599.8" r="4" fill="#5B8FE8"/>
    <circle cx="105.6" cy="570.0" r="5" fill="#5B8FE8"/>
    <circle cx="89.4" cy="538.3" r="4" fill="#5B8FE8"/>
    <circle cx="76.6" cy="505.1" r="11" fill="#FFC107"/>
    <circle cx="67.4" cy="470.7" r="4" fill="#5B8FE8"/>
    <circle cx="61.9" cy="435.5" r="5" fill="#5B8FE8"/>
    <circle cx="60.0" cy="400.0" r="4" fill="#5B8FE8"/>
    <circle cx="61.9" cy="364.5" r="5" fill="#5B8FE8"/>
    <circle cx="67.4" cy="329.3" r="4" fill="#5B8FE8"/>
    <circle cx="76.6" cy="294.9" r="11" fill="#FFC107"/>
    <circle cx="89.4" cy="261.7" r="4" fill="#5B8FE8"/>
    <circle cx="105.6" cy="230.0" r="5" fill="#5B8FE8"/>
    <circle cx="124.9" cy="200.2" r="4" fill="#5B8FE8"/>
    <circle cx="147.3" cy="172.5" r="5" fill="#5B8FE8"/>
    <circle cx="172.5" cy="147.3" r="4" fill="#5B8FE8"/>
    <circle cx="200.2" cy="124.9" r="11" fill="#FFC107"/>
    <circle cx="230.0" cy="105.6" r="4" fill="#5B8FE8"/>
    <circle cx="261.7" cy="89.4" r="5" fill="#5B8FE8"/>
    <circle cx="294.9" cy="76.6" r="4" fill="#5B8FE8"/>
    <circle cx="329.3" cy="67.4" r="5" fill="#5B8FE8"/>
    <circle cx="364.5" cy="61.9" r="4" fill="#5B8FE8"/>
  </g>

  <\!-- ======================== Kalender (oben) ====================
       Position etwas höher als zentriert: Center (400, 195).
       Kalender-Body: 200×175, oben zwei „Ringe", unten Checkmark. -->
  <g id="calendar" transform="translate(300, 110)">
    <\!-- Schatten unter dem Kalender (subtle) -->
    <ellipse cx="100" cy="180" rx="90" ry="8" fill="#000" opacity="0.18"/>

    <\!-- Body -->
    <rect x="0" y="25" width="200" height="170" rx="22"
          fill="url(#calBlue)"/>

    <\!-- Header-Streifen (dunklerer Blauton) -->
    <path d="M 0 47 L 0 70 L 200 70 L 200 47 A 22 22 0 0 0 178 25 L 22 25 A 22 22 0 0 0 0 47 Z"
          fill="url(#calBlueDark)"/>

    <\!-- Trenn-Linie zwischen Header und Body -->
    <line x1="14" y1="78" x2="186" y2="78"
          stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2"/>

    <\!-- Zwei „Ringe"/Halterungen oben, gelb -->
    <rect x="48"  y="5" width="22" height="48" rx="9" fill="#FFC107"/>
    <rect x="130" y="5" width="22" height="48" rx="9" fill="#FFC107"/>

    <\!-- Checkmark im Body -->
    <path d="M 60 140 L 90 170 L 150 105"
          stroke="white" stroke-width="16"
          stroke-linecap="round" stroke-linejoin="round"
          fill="none"/>
  </g>

  <\!-- ======================== SALY-Text ============================
       Statt „LYANDRO BOOKING" steht jetzt „SALY" zentriert in der Mitte. -->
  <text x="400" y="445"
        text-anchor="middle"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-weight="900"
        font-size="130"
        letter-spacing="6"
        fill="#FFFFFF">SALY</text>

  <\!-- ======================== Pin (unten) ==========================
       Center (400, 605). Tropfenform mit dunklem Innenkreis + Check. -->
  <g id="pin" transform="translate(330, 510)">
    <\!-- Schatten unter dem Pin -->
    <ellipse cx="70" cy="195" rx="40" ry="6" fill="#000" opacity="0.22"/>

    <\!-- Pin-Tropfen: oben Kreis, unten Spitze -->
    <path d="M 70 0
             C 31 0 0 31 0 70
             C 0 110 70 195 70 195
             C 70 195 140 110 140 70
             C 140 31 109 0 70 0 Z"
          fill="url(#pinYellow)"/>

    <\!-- Highlight oben links -->
    <path d="M 70 0
             C 31 0 0 31 0 70
             C 0 110 70 195 70 195
             C 70 195 140 110 140 70
             C 140 31 109 0 70 0 Z"
          fill="url(#pinHighlight)"/>

    <\!-- Dunkler Innenkreis -->
    <circle cx="70" cy="68" r="36" fill="url(#pinInner)"/>

    <\!-- Checkmark im Pin -->
    <path d="M 53 68 L 65 80 L 90 56"
          stroke="white" stroke-width="7"
          stroke-linecap="round" stroke-linejoin="round"
          fill="none"/>
  </g>
</svg>